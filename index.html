<!DOCTYPE html><html><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<head>

    <link rel="stylesheet" href=
"https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<title>Leaf & Life Bill</title>
<style>
body{margin:0;background:radial-gradient(circle at top left,#f6fbf6 0%,#e8f2e8 45%,#e0ece0 100%);font-family:Segoe UI,Arial,sans-serif;color:#223126}
.card{max-width:920px;margin:24px auto;background:#fbfdfb;border-radius:24px;box-shadow:0 20px 50px rgba(26,61,35,.14);padding:30px 32px;border:1px solid #e5eee4;position:relative;overflow:hidden}
.card:before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#2e7d32,#6bbf6f)}
.header{display:flex;flex-direction:column;align-items:center;border-bottom:1px solid #e3ece4;padding-bottom:18px;margin-bottom:20px;gap:12px}
.logo{height:84px;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center}
.thank-you{color:#4f6b53;text-align:center;font-size:14px;line-height:1.5;font-weight:600}
h1{margin:0;color:#2e7d32;font-size:29px;letter-spacing:-.02em}small{color:#6b7a6f;display:block;margin-top:3px;font-size:13px}
.info-row{display:grid;grid-template-columns:1fr minmax(220px,280px);gap:14px;margin:18px 0 14px}
.info-left,.info-right{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:11px;color:#6b7a6f;font-weight:700;letter-spacing:.08em;text-transform:uppercase}input{width:100%;padding:11px 12px;border:1px solid #dbe7de;border-radius:10px;background:#fcfdfc;box-sizing:border-box;transition:border-color .2s,box-shadow .2s,transform .2s;font-family:inherit;font-size:14px;color:#223126}input:focus{outline:none;border-color:#2e7d32;box-shadow:0 0 0 3px rgba(46,125,50,.12)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;color:#2e7d32;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.table-shell{border:1px solid #e8efe9;border-radius:14px;overflow:hidden;background:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:#2e7d32;padding:12px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;background:#f5faf5;border-bottom:1px solid #e3ece4}
td{background:#fff;padding:10px;border-bottom:1px solid #eef3ee}
tbody tr:nth-child(even) td{background:#f8fbf8}
tbody tr:hover td{background:#f2f8f2}
td:first-child{border-radius:8px 0 0 8px}td:last-child{border-radius:0 8px 8px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
button{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;border:0;border-radius:10px;padding:10px 14px;margin:0;cursor:pointer;font-weight:700;box-shadow:0 8px 18px rgba(46,125,50,.16);transition:transform .15s ease,box-shadow .15s ease}
button.secondary{background:#f2f7f2;color:#2e7d32;border:1px solid #d7e6da;box-shadow:none}
button.delete-btn{background:#fff;color:#c62828;border:1px solid #f2c7c7;box-shadow:none;padding:8px 10px}
button:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(46,125,50,.2)}
.total{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px;padding:12px 16px;border:1px solid #dce8de;border-radius:12px;background:linear-gradient(135deg,#f4faf4,#eaf6ea);width:fit-content;margin-left:auto;font-size:20px;font-weight:700;color:#1b5e20;min-width:220px}
.footer{display:flex;justify-content:space-between;align-items:flex-start;margin-top:20px;border-top:1px solid #e3ece4;padding-top:18px;color:#5d6e62;gap:16px}
.contact-block{max-width:55%;font-size:13px;line-height:1.6;color:#4f6b53}
.contact-block b{display:block;margin-bottom:8px;color:#2e7d32}
.scan-block{text-align:center;min-width:180px}
.scan-title{font-weight:700;color:#2e7d32;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.qr{height:120px;border-radius:12px;border:1px solid #e6eee7;padding:6px;background:#fff}
@media (max-width:640px){.grid{grid-template-columns:1fr}.info-row{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start}.brand{align-items:flex-start;text-align:left}.footer{flex-direction:column;align-items:flex-start}.total{width:100%;justify-content:space-between}.scan-block{margin-top:16px;width:100%}}@media print{button{display:none}body{background:#fff}.card{box-shadow:none;margin:0;border:0;padding:0}input,textarea,select{border:none!important;background:transparent!important;box-shadow:none!important;padding:0!important;margin:0!important}#t td:last-child,th:last-child{display:none}#t td{padding:8px 6px}#t td input{width:auto!important}}
