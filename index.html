<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>Leaf & Life Bills</title>
  <style>
    :root{color-scheme:light}
    body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f4f8f4 0%,#eaf4ea 100%);color:#223126}
    .page{max-width:1100px;margin:24px auto;padding:24px}
    .header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{width:52px;height:52px;object-fit:contain}
    .brand-title{display:flex;flex-direction:column}
    .brand-title h1{margin:0;color:#2e7d32}
    .brand-title p{margin:4px 0 0;color:#4f6b53}
    .top-actions{display:flex;gap:10px;flex-wrap:wrap}
    button,a.button{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:10px;padding:10px 14px;background:#2e7d32;color:#fff;text-decoration:none;cursor:pointer;font-weight:700}
    a.button.secondary{background:#f2f7f2;color:#2e7d32;border:1px solid #d7e6da}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 40px rgba(26,61,35,.08)}
    .panel h2{margin:0 0 12px;font-size:18px;color:#2e7d32}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px 10px;border-bottom:1px solid #e8efe9;text-align:left}
    th{background:#f5faf5;color:#2e7d32;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
    .status{font-weight:700;padding:6px 10px;border-radius:999px;display:inline-block}
    .status.draft{background:#eef7ed;color:#2e7d32}
    .status.delivered{background:#dff0dd;color:#1a5d2d}
    .empty{color:#6b7a6f;font-style:italic}
    .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .actions .link{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:8px 10px;border-radius:10px;text-decoration:none}
    .actions button{min-height:36px}
    .link{color:#2e7d32;font-weight:700;text-decoration:none}
    @media (max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class='page'>
    <div class='header'>
      <div class='brand'>
        <img src='logo.png' alt='Leaf & Life logo'>
        <div class='brand-title'>
          <h1>Leaf & Life Bills</h1>
          <p>Drafts and delivered bills, sorted by most recent activity.</p>
        </div>
      </div>
      <div class='top-actions'>
        <a class='button' href='bill.html'>Create New Bill</a>
        <button onclick='loadBills()'>Refresh</button>
      </div>
    </div>

    <div class='grid'>
      <section class='panel'>
        <h2>Draft Bills</h2>
        <table id='draftTable'>
          <thead><tr><th>Bill #</th><th>Customer</th><th>Date</th><th>Total</th><th>Action</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section class='panel'>
        <h2>Delivered Bills</h2>
        <table id='deliveredTable'>
          <thead><tr><th>Bill #</th><th>Customer</th><th>Date</th><th>Total</th><th>Action</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </div>

  <script>
    async function loadBills() {
      const res = await fetch('/api/bills');
      const bills = await res.json();
      const sorted = bills.slice().sort((a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0));
      renderTable('draftTable', sorted.filter(b => b.status === 'draft'));
      renderTable('deliveredTable', sorted.filter(b => b.status === 'delivered'));
    }

    function renderTable(tableId, bills) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      tbody.innerHTML = '';
      if (!bills.length) {
        tbody.innerHTML = `<tr><td colspan='5' class='empty'>No bills in this section yet.</td></tr>`;
        return;
      }
      bills.forEach(bill => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${bill.billNumber}</td>
          <td>${bill.customerName || '—'}</td>
          <td>${bill.date || '—'}</td>
          <td>₹ ${Number(bill.total || 0).toFixed(2)}</td>
          <td><div class='actions'><a class='link' href='bill.html?fileName=${encodeURIComponent(bill.fileName)}'>Open</a><button class='button secondary' style='background:#fff;color:#c62828;border:1px solid #f2c7c7;margin-left:8px;padding:8px 12px' onclick='deleteBill("${encodeURIComponent(bill.fileName)}")'>Delete</button></div></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteBill(fileName) {
      if (!confirm('Delete this bill? This cannot be undone.')) return;
      const res = await fetch('/api/delete-bill', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ fileName: decodeURIComponent(fileName) })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert('Could not delete bill: ' + (err.error || 'Unknown error'));
        return;
      }
      loadBills();
    }

    loadBills();
  </script>
</body>
</html>
